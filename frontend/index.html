<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>IT Helpdesk Management System</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <h1>IT Helpdesk Management System</h1>

        <p>Manage IT support tickets easily</p>

    </header>


    <main>

        <!-- ========================= -->
        <!-- LOGIN -->
        <!-- ========================= -->

        <section class="card">

            <h2>Login</h2>

            <form id="loginForm">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p id="loginMessage"></p>

        </section>


        <!-- ========================= -->
        <!-- CREATE TICKET -->
        <!-- ========================= -->

        <section class="card">

            <h2>Create Support Ticket</h2>

            <form id="ticketForm">

                <label>Title</label>

                <input
                    type="text"
                    id="title"
                    placeholder="Enter issue title"
                    required
                >

                <label>Description</label>

                <textarea
                    id="description"
                    placeholder="Describe your issue"
                    required
                ></textarea>

                <label>Priority</label>

                <select id="priority">

                    <option value="LOW">
                        Low
                    </option>

                    <option value="MEDIUM">
                        Medium
                    </option>

                    <option value="HIGH">
                        High
                    </option>

                </select>


                <label>Category</label>

                <select id="category">

                    <option value="1">
                        Hardware
                    </option>

                    <option value="2">
                        Software
                    </option>

                    <option value="3">
                        Network
                    </option>

                    <option value="4">
                        Account/Login
                    </option>

                    <option value="5">
                        Other
                    </option>

                </select>


                <button type="submit">
                    Create Ticket
                </button>

            </form>

            <p id="ticketMessage"></p>


            <button
                id="viewTicketsBtn"
                type="button">

                View My Tickets

            </button>


            <div id="ticketsList"></div>

        </section>


        <!-- ========================= -->
        <!-- ADMIN DASHBOARD -->
        <!-- ========================= -->

        <section class="card">

            <h2>Admin Dashboard</h2>


            <button
                id="viewAllTicketsBtn"
                type="button">

                View All Tickets

            </button>


            <div id="allTicketsList"></div>


            <h3>Assign Ticket</h3>


            <form id="assignTicketForm">

                <label>Ticket ID</label>

                <input
                    type="number"
                    id="assignTicketId"
                    placeholder="Enter ticket ID"
                    required
                >


                <label>Agent ID</label>

                <input
                    type="number"
                    id="assignAgentId"
                    placeholder="Enter agent ID"
                    required
                >


                <button type="submit">

                    Assign Ticket

                </button>

            </form>


            <p id="assignMessage"></p>

        </section>


        <!-- ========================= -->
        <!-- AGENT DASHBOARD -->
        <!-- ========================= -->

        <section class="card">

            <h2>Agent Dashboard</h2>


            <label>Agent ID</label>

            <input
                type="number"
                id="agentDashboardId"
                placeholder="Enter Agent ID"
            >


            <button
                id="viewAssignedTicketsBtn"
                type="button">

                View Assigned Tickets

            </button>


            <div id="assignedTicketsList"></div>


            <h3>Update Ticket Status</h3>


            <form id="updateStatusForm">

                <label>Ticket ID</label>

                <input
                    type="number"
                    id="statusTicketId"
                    placeholder="Enter Ticket ID"
                    required
                >


                <label>Status</label>

                <select id="ticketStatus">

                    <option value="IN_PROGRESS">
                        IN_PROGRESS
                    </option>

                    <option value="RESOLVED">
                        RESOLVED
                    </option>

                </select>


                <button type="submit">

                    Update Status

                </button>

            </form>


            <p id="statusMessage"></p>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
